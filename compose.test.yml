name: lab-test

services:
  app:
    build:
      target: test
    restart: no
    ports: !reset [] # para não herdar
    image: lab-app:test
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_test
      NODE_ENV: test
    command: sh -c "npx prisma migrate deploy && npm test"

  db:
    environment:
      POSTGRES_DB: app_test