services:
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      JWT_SECRET: ${JWT_SECRET:?} # Se não existir ou estiver vazia, o compose não sobe.
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  db:
    image: postgres:15
    restart: unless-stopped
    healthcheck: # Só sobe após estar tudo ok.
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: